name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Server runtime deps (flask, requests, gunicorn) + test runner.
          # PIL / spidev / RPi.GPIO are intentionally omitted — the server
          # degrades gracefully without them, so the API test suite needs none.
          pip install -r server/requirements.txt pytest

      - name: Run tests
        run: pytest
